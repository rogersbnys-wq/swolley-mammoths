# Builds the Vite app and publishes it to GitHub Pages on every push
# to main. This replaced a Netlify-based deploy after that team's
# billing plan paused production deploys — GitHub Pages is part of the
# same free GitHub account this repo already lives in, so there's no
# separate billing relationship that can hit a similar wall.
#
# One-time setup this workflow can't do for you: in the repo's
# Settings → Pages, set "Source" to "GitHub Actions". After that, every
# push to main redeploys automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
